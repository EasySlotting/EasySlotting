default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('DB_POOL', ENV.fetch('RAILS_MAX_THREADS', 10)).to_i %>
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  port: <%= ENV.fetch('DB_PORT', 5432).to_i %>
  username: <%= ENV.fetch('DB_USER', 'postgres') %>
  password: <%= ENV['DB_PASSWORD'].to_json %>

development:
  <<: *default
  database: <%= ENV.fetch('DB_DATABASE', 'app_development') %>

test:
  <<: *default
  database: <%= ENV.fetch('TEST_DB_DATABASE', 'app_test') %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch('DB_DATABASE', 'easyslotting_production') %>
  queue:
    <<: *default
    database: <%= ENV.fetch('QUEUE_DB_DATABASE', "#{ENV.fetch('DB_DATABASE', 'easyslotting_production')}_queue") %>
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch('CACHE_DB_DATABASE', "#{ENV.fetch('DB_DATABASE', 'easyslotting_production')}_cache") %>
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch('CABLE_DB_DATABASE', "#{ENV.fetch('DB_DATABASE', 'easyslotting_production')}_cable") %>
    migrations_paths: db/cable_migrate
